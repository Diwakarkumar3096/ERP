    <script>
      // Gracefully handle benign Vite HMR WebSocket closures in cloud proxy / iframe environments
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('ws://') || e.message.includes('wss://'))) {
          e.preventDefault?.();
          e.stopImmediatePropagation?.();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://')) {
          e.preventDefault?.();
          e.stopImmediatePropagation?.();
          return true;
        }
      }, true);
    </script>
